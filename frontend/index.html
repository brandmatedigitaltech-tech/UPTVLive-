<!doctype html>
<html lang="en">

<head>

  <!-- ================================================= -->
  <!-- ================= BASIC ========================== -->
  <!-- ================================================= -->

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    http-equiv="X-UA-Compatible"
    content="IE=edge"
  />

  <!-- ================================================= -->
  <!-- ================= TITLE ========================== -->
  <!-- ================================================= -->

  <title>
    UPTV Live - Breaking News & Latest Updates
  </title>

  <!-- ================================================= -->
  <!-- ================= FAVICON ======================== -->
  <!-- ================================================= -->

  <link
    rel="icon"
    type="image/jpeg"
    href="/logo.jpeg"
  />

  <!-- ================================================= -->
  <!-- ================= SEO ============================ -->
  <!-- ================================================= -->

  <meta
    name="description"
    content="UPTV Live provides latest breaking news, politics, city news, trending videos and live updates from Uttar Pradesh and India."
  />

  <meta
    name="keywords"
    content="UPTV Live, Hindi News, Uttar Pradesh News, Breaking News, Live News, Politics, Kanpur News, Lucknow News"
  />

  <meta
    name="author"
    content="UPTV Live"
  />

  <meta
    name="robots"
    content="index, follow"
  />

  <meta
    name="theme-color"
    content="#d60000"
  />

  <!-- ================================================= -->
  <!-- ================= CANONICAL ====================== -->
  <!-- ================================================= -->

  <link
    rel="canonical"
    href="https://www.uptvlive.com"
  />

  <!-- ================================================= -->
  <!-- ================= OPEN GRAPH ==================== -->
  <!-- ================================================= -->

  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:site_name"
    content="UPTV Live"
  />

  <meta
    property="og:locale"
    content="hi_IN"
  />

  <meta
    property="og:title"
    content="UPTV Live - Breaking News & Latest Updates"
  />

  <meta
    property="og:description"
    content="Latest Hindi news, politics, city updates, breaking stories and trending videos from UPTV Live."
  />

  <meta
    property="og:image"
    content="https://www.uptvlive.com/logo.jpeg"
  />

  <meta
    property="og:image:width"
    content="1200"
  />

  <meta
    property="og:image:height"
    content="630"
  />

  <meta
    property="og:url"
    content="https://www.uptvlive.com"
  />

  <!-- ================================================= -->
  <!-- ================= TWITTER ======================== -->
  <!-- ================================================= -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="UPTV Live - Breaking News & Latest Updates"
  />

  <meta
    name="twitter:description"
    content="Latest Hindi news, politics, city updates and breaking stories from UPTV Live."
  />

  <meta
    name="twitter:image"
    content="https://www.uptvlive.com/logo.jpeg"
  />

  <!-- ================================================= -->
  <!-- ================= FONT AWESOME ================== -->
  <!-- ================================================= -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

</head>

<body>

  <!-- ================================================= -->
  <!-- ================= ROOT =========================== -->
  <!-- ================================================= -->

  <div id="root"></div>

  <!-- ================================================= -->
  <!-- ================= MAIN =========================== -->
  <!-- ================================================= -->

  <script
    type="module"
    src="/src/main.jsx"
  ></script>

</body>

</html>
